<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>word counter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #5a3d8a;
    --soft: #9b86c4;
    --pink: #ff9ed8;
    --lilac: #cdb8ff;
    --sky: #a8dcff;
    --mg1: 227, 154, 110;
	--mg2: 223, 192, 189;
	--mg3: 200, 163, 99;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    font-family: Uncut Sans Variable, sans-serif;
    color: var(--ink);
    background-image: linear-gradient(44deg, rgba(var(--mg1),1), rgba(var(--mg2),1), rgba(var(--mg3),1));
    background-color:#ggg;
        background-attachment: fixed;
  }
  .glass {
    width: 100%;
    max-width: 460px;
    padding: 20px;
    border-radius: 40px;
    background: rgba(255,255,255,.15);
    border: 1.5px solid rgba(255,255,255,.3);
    -webkit-backdrop-filter: blur(18px);
    backdrop-filter: blur(18px);
  }
  textarea {
    display: block;
    width: 100%;
    height: 180px;
    resize: none;
    padding: 16px 18px;
    font-family: Uncut Sans Variable, sans-serif;
    font-size: 14px; letter-spacing:0.5px;
    font-weight:300; 
    color:rgba(var(--mg1),1);
    background: rgba(255,255,255,.7);
    border: 1.5px solid transparent;
    border-radius: 26px;
    text-align: justify; line-height:20px;
  }
  textarea::placeholder { color:rgba(var(--mg3),0.5); opacity: .8; font-family:Google Sans Code; }
  textarea:focus-visible {
    outline: none;
    border-color: var(--pink);
    box-shadow: 0 0 0 5px rgba(255,158,216,.25);
  }
  .count {
    margin-top: 16px;
    padding: 18px 12px 16px;
    text-align: center;
    border-radius: 30px;
    background: linear-gradient(135deg, rgba(255,255,255,.85), rgba(255,255,255,.35));
    border: 1.5px solid #fff;
  }
  .num {
    display: block;
    font-size: clamp(3.4rem, 16vw, 4.6rem);
    font-weight: 700;
    line-height: 1;
    background: rgba(var(--mg2),1);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 2px 0 rgba(255,255,255,.9));
  }
  .label {
    display: block;
    margin-top: 6px;
    font-size: .95rem;
    font-weight: 500;
    letter-spacing: .08em;
    color:rgba(var(--mg1),0.5);
  }
</style>
</head>
<body>
  <main class="glass">
    <label for="text" hidden>Your text</label>
    <textarea id="text" placeholder="paste your text here"></textarea>
    <div class="count" aria-live="polite">
      <span class="num" id="words">0</span>
      <span class="label" id="label">words</span>
    </div>
  </main>

<script>
  const text = document.getElementById('text');
  const num = document.getElementById('words');
  const label = document.getElementById('label');

  function update() {
    const trimmed = text.value.trim();
    const count = trimmed ? trimmed.split(/\s+/).length : 0;
    num.textContent = count.toLocaleString();
    label.textContent = count === 1 ? 'word' : 'words';
  }

  text.addEventListener('input', update);
  update();
</script>
</body>
</html>
